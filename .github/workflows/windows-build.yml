name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Windows x64 application
        run: dotnet publish SwitchController/SwitchController.csproj --configuration Release --runtime win-x64 --self-contained false --output publish

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchController-win-x64
          path: publish/
          if-no-files-found: error
